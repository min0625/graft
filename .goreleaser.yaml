# GoReleaser configuration (spec §2 G2/G6/G7, task T3.4): tagging
# vX.Y.Z builds the six release binaries (linux/darwin/windows ×
# amd64/arm64) and publishes them to GitHub Releases with a SHA256SUMS file.
#
# Validate with `goreleaser check`; dry-run with
# `goreleaser release --snapshot --clean`.
version: 2

project_name: graft

builds:
  - id: graft
    main: ./cmd/graft
    binary: graft
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*
    # Versionless archive names keep the download URLs stable for the
    # install scripts: graft_<os>_<arch>.tar.gz / .zip.
    name_template: >-
      {{- .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^chore(\(deps\))?:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
